<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta property="og:title" content="MUKANTARA — Sanal Salon" />
  <title>MUKANTARA — Sanal Salon</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background:#0d0f0c; }
    #renderCanvas { width: 100%; height: 100%; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <!-- Gömülü araç katmanı: dijital araçlar burada, aynı sayfa içinde açılır.
       Yeni sekme YOK — sadece bu overlay görünür/gizlenir. -->
  <div id="toolOverlay" style="display:none; position:fixed; inset:0; z-index:9999; background:#04090b;">
    <button id="toolCloseBtn" style="position:absolute; top:14px; right:14px; z-index:10000; background:#0d1a1e; color:#eafcff; border:1px solid #8fe9f5; border-radius:6px; padding:10px 16px; font-family:Georgia, serif; font-size:16px; cursor:pointer;">✕ Salona Dön</button>
    <iframe id="toolFrame" style="width:100%; height:100%; border:none;" src="about:blank"></iframe>
  </div>

  <!-- BabylonJS -->
  <script src="https://cdn.jsdelivr.net/npm/babylonjs@9.10.1/babylon.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@9.10.1/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs-gui@9.10.1/babylon.gui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/earcut@2.2.4/dist/earcut.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs-materials@9.10.1/babylonjs.materials.min.js"></script>

  <!-- Immersion engine (Apache 2.0 — bkz. LICENSE / NOTICE) -->
  <script src="/immersion_engine/immersion.js"></script>
  <script src="/immersion_engine/immersionUI.js"></script>
  <script src="/immersion_engine/stands/Stand.js"></script>
  <script src="/immersion_engine/stands/Display.js"></script>
  <script src="/immersion_engine/stands/Plinth.js"></script>
  <script src="/immersion_engine/stands/Teleporter.js"></script>
  <script src="/immersion_engine/stands/Link.js"></script>

  <script>
    window.openEmbeddedTool = function (url, title) {
      document.getElementById("toolFrame").src = url;
      document.getElementById("toolOverlay").style.display = "block";
    };
    document.getElementById("toolCloseBtn").addEventListener("click", function () {
      document.getElementById("toolOverlay").style.display = "none";
      document.getElementById("toolFrame").src = "about:blank";
    });
  </script>

  <!-- MUKANTARA salonu -->
  <script src="salon.js?v=9"></script>

  <script>
    createImmersion(MukantaraSalon);
  </script>
</body>
</html>
