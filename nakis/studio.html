<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NAKIŞ Studio</title>
<style>
:root{color-scheme:dark;--bg:#141210;--pn:#1c1915;--fg:#e9e2d2;--mut:#a79d88;--line:#3a342b;--acc:#c59558;--on:#2a2318}
@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#f4f0e6;--pn:#fbf8f1;--fg:#241f17;--mut:#6d644f;--line:#d9d1bf;--acc:#8a5a1f;--on:#efe4cc}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}
header b{letter-spacing:.2em;font-weight:500}header span{color:var(--mut);font-size:13px}
button,select,input[type=text],textarea{font:inherit;color:inherit;background:var(--pn);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:38px}
button{cursor:pointer}button:hover{border-color:var(--acc)}button.pri{background:var(--acc);color:#141210;border-color:var(--acc);font-weight:600}
#app{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
@media(max-width:980px){#app{grid-template-columns:minmax(0,1fr)}}#app>*{min-width:0}#panel{overflow-x:hidden}
#stage{display:flex;flex-direction:column;align-items:center;gap:10px;position:sticky;top:8px;align-self:start}
@media(max-width:980px){#stage{position:static}}
canvas#c{width:100%;max-width:560px;aspect-ratio:1080/1350;background:#121212;border-radius:6px;box-shadow:0 10px 40px #0008;touch-action:none;cursor:grab}
#tr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;width:100%;max-width:560px}
#seek{flex:1 1 160px;accent-color:var(--acc)}#tm{font-variant-numeric:tabular-nums;min-width:44px;text-align:center;color:var(--mut)}
#tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
#tabs button{flex:1 1 auto;padding:8px 10px}#tabs button.on{background:var(--on);border-color:var(--acc)}
#panel{background:var(--pn);border:1px solid var(--line);border-radius:10px;padding:14px}
h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:18px 0 8px;font-weight:600}h3:first-child{margin-top:0}
.hint{color:var(--mut);font-size:13px;margin:4px 0 8px}
ul#layers{list-style:none;margin:0;padding:0}
ul#layers li{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid transparent;border-radius:8px}
ul#layers li.on{background:var(--on);border-color:var(--acc)}
ul#layers .nm{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ul#layers button{padding:2px 8px;min-height:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.grid button{text-align:left;font-size:13px;padding:6px 8px}.grid button small{display:block;color:var(--mut)}
.ctl{display:grid;grid-template-columns:96px 1fr 52px;gap:8px;align-items:center;margin:6px 0}
.ctl input[type=range]{width:100%;accent-color:var(--acc)}.ctl output{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
.ctl2{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;margin:6px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;background:var(--bg)}
.card.on{border-color:var(--acc);background:var(--on)}.card b{display:block;font-size:14px}.card small{display:block;color:var(--mut);font-size:12px;line-height:1.3}
.sw{display:flex;height:22px;border-radius:5px;overflow:hidden;margin-bottom:6px;border:1px solid var(--line)}.sw i{flex:1}.sw i:first-child{flex:2}
.card label{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center;margin-top:4px}
textarea{width:100%;min-height:70px;resize:vertical}input[type=text]{width:100%}
.desc{white-space:pre-wrap;font-size:13px;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:300px;overflow:auto}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--acc);color:#141210;padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}#toast.on{opacity:1}
</style>
</head>
<body>
<header><div><b>NAKIŞ STUDIO</b> <span id="sub"></span></div><div><button id="lang">EN</button></div></header>
<div id="app">
 <div id="stage">
  <canvas id="c" width="1080" height="1350"></canvas>
  <div id="tr"><button id="pp" class="pri"></button><input id="seek" type="range" min="0" max="1000" value="0"><span id="tm">0:00</span></div>
 </div>
 <div><div id="tabs"></div><div id="panel"></div></div>
</div>
<div id="toast"></div>
<script type="module" src="studio.js"></script>
</body>
</html>
