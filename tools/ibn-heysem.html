<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100vh; height:100dvh; overflow:hidden;
  background:#000005; color:#c8cdd8;
  font-family:'Cormorant Garamond', Georgia, serif;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce) { .scene-card { transition-duration: 0.01ms !important; } }
#stage {
  position:fixed; inset:0; display:grid;
  grid-template-columns: 55% 45%;
}
#sim { position:relative; overflow:hidden; }
#sim::after {
  content:''; position:absolute; inset:0; pointer-events:none; z-index:2;
  background: linear-gradient(to right, transparent 70%, rgba(0,0,5,0.88) 100%);
}
#narrativeWrap {
  position:relative; display:flex; flex-direction:column;
  height:100%; padding:clamp(18px,4vh,48px) clamp(18px,5vw,56px) clamp(16px,3.5vh,40px) clamp(18px,4.5vw,52px);
  overflow:hidden; z-index:3;
}
#narrativeWrap::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background-image: radial-gradient(circle, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size:40px 40px;
}
#divider {
  position:absolute; top:10%; bottom:10%; left:0; width:1px; z-index:4;
  background:linear-gradient(to bottom,
    transparent 0%, rgba(232,201,122,0.18) 30%,
    rgba(232,201,122,0.18) 70%, transparent 100%);
}

/* ── TOP META ── */
#topMeta {
  flex-shrink:0; display:flex; align-items:flex-start;
  justify-content:space-between; position:relative; z-index:2;
  padding-bottom:24px; border-bottom:1px solid rgba(255,255,255,0.05);
  flex-wrap:wrap; row-gap:10px;
}
.meta-block { display:flex; flex-direction:column; gap:5px; }
.meta-label {
  font-family:'Courier Prime', monospace; font-size:10px;
  letter-spacing:0.4em; text-transform:uppercase;
  color:rgba(200,205,216,0.45); line-height:1.9;
}
.meta-label strong { display:block; color:rgba(200,205,216,0.7); font-weight:400; }
.meta-label em     { font-style:italic; color:rgba(200,205,216,0.45); }

/* Progress */
.progress-track { display:flex; align-items:center; gap:5px; margin-top:8px; }
.progress-pip {
  height:8px; width:20px; display:flex; align-items:center;
  cursor:pointer; padding:0; background:none; border:none;
}
.progress-pip::before {
  content:''; display:block; width:100%; height:1px;
  background:rgba(200,205,216,0.12); transition:background 0.7s ease, width 0.7s ease, height 0.2s ease;
}
.progress-pip:hover::before { height:2px; background:rgba(200,205,216,0.4); }
.progress-pip.done::before   { background:rgba(200,205,216,0.5); }
.progress-pip.active::before { background:#e8c97a; width:32px; }

/* Playback controls */
#playbackCtr { display:flex; align-items:center; gap:12px; margin-top:8px; }
.ctrl-btn {
  background:none; border:1px solid rgba(200,205,216,0.25); color:rgba(200,205,216,0.65);
  width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:11px; font-family:'Courier Prime',monospace;
  transition:border-color 0.3s, color 0.3s, background 0.3s;
}
.ctrl-btn:hover { border-color:rgba(232,201,122,0.6); color:#e8c97a; background:rgba(232,201,122,0.08); }
.ctrl-btn:focus-visible { outline:1px solid #e8c97a; outline-offset:2px; }

/* ── SCENE AREA ── */
#sceneArea { flex:1 1 0; position:relative; z-index:2; overflow:hidden; min-height:0; }
.scene-card {
  position:absolute; inset:0; display:flex; flex-direction:column;
  justify-content:center; padding:clamp(10px,2vh,28px) 0;
  opacity:0; transform:translateY(16px);
  transition:opacity 0.55s cubic-bezier(0.22,1,0.36,1),
             transform 0.55s cubic-bezier(0.22,1,0.36,1);
  pointer-events:none; overflow-y:auto; overscroll-behavior:contain;
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
}
.scene-card::-webkit-scrollbar { display:none; }
.scene-card.entering { opacity:1; transform:translateY(0); pointer-events:auto; }
.scene-card.exiting  { opacity:0; transform:translateY(-16px);
  transition:opacity 0.4s ease, transform 0.4s ease; }
.scene-eyebrow {
  font-family:'Courier Prime', monospace; font-size:clamp(8px,0.9vw,10px);
  letter-spacing:0.5em; text-transform:uppercase;
  color:#e8c97a; opacity:0.75; margin-bottom:clamp(8px,1.6vh,18px); flex-shrink:0;
}
.scene-title {
  font-size:clamp(26px,4.6vw,52px); font-weight:300; line-height:1.12;
  letter-spacing:0.01em; color:#f0f2f5; margin-bottom:clamp(10px,2vh,24px); flex-shrink:0;
}
.scene-title em { font-style:italic; color:#e8c97a; }
.scene-body {
  font-size:clamp(14px,1.7vw,19px); font-weight:300; line-height:1.7;
  color:rgba(200,205,216,0.68); flex-shrink:0;
}
.scene-body em     { font-style:italic; color:rgba(220,225,235,0.9); }
.scene-body strong { font-weight:600; color:rgba(232,201,122,0.88); font-style:normal; }
.scene-formula {
  margin-top:clamp(10px,1.8vh,20px); padding:clamp(10px,1.6vh,14px) clamp(12px,1.8vw,18px);
  border-left:2px solid rgba(232,201,122,0.28);
  background:rgba(232,201,122,0.035); border-radius:0 5px 5px 0; flex-shrink:0;
}
.scene-formula p {
  font-family:'Courier Prime', monospace; font-size:clamp(11px,1.1vw,13px);
  letter-spacing:0.07em; color:rgba(232,201,122,0.72); line-height:1.7;
}

/* ── BOTTOM ROW ── */
#bottomRow {
  flex-shrink:0; display:flex; align-items:flex-end;
  justify-content:space-between; position:relative; z-index:2;
  padding-top:clamp(10px,2vh,20px); border-top:1px solid rgba(255,255,255,0.05);
  flex-wrap:wrap; row-gap:8px;
}
#authorCredit { font-style:italic; font-size:clamp(11px,1.3vw,14px); letter-spacing:0.08em; color:rgba(200,205,216,0.28); line-height:1.9; }
#authorCredit strong { font-style:normal; font-weight:400; font-size:clamp(12px,1.4vw,15px); color:rgba(200,205,216,0.48); display:block; }
#timerWrap { text-align:right; }
.timer-label {
  font-family:'Courier Prime', monospace; font-size:9px;
  letter-spacing:0.4em; color:rgba(200,205,216,0.2);
  text-transform:uppercase; display:block; margin-bottom:8px;
}
#timerBar { width:100px; height:1px; background:rgba(200,205,216,0.08); position:relative; overflow:hidden; margin-left:auto; }
#timerFill { position:absolute; left:0; top:0; height:100%; background:rgba(232,201,122,0.55); width:0%; transition:width 0.25s linear; }

/* ── NARROW SCREENS — stack #sim above narrative instead of squeezing 45% ── */
@media (max-width: 860px) {
  #stage { grid-template-columns:1fr; grid-template-rows:34vh 1fr; grid-template-rows:34dvh 1fr; }
  #sim::after { background: linear-gradient(to bottom, transparent 55%, rgba(0,0,5,0.9) 100%); }
  #divider { display:none; }
  #narrativeWrap { padding:16px 18px 14px 18px; }
  .scene-title { font-size:clamp(24px,7vw,36px); }
  .scene-body  { font-size:clamp(13px,3.6vw,16px); }
}

/* ── SHORT SCREENS — vertical space is scarce, independent of width ── */
@media (max-height: 640px) {
  #narrativeWrap { padding-top:10px; padding-bottom:10px; }
  #topMeta { padding-bottom:8px; }
  .scene-eyebrow { font-size:8px; margin-bottom:6px; }
  .scene-title { font-size:clamp(20px,4vw,28px); line-height:1.05; margin-bottom:8px; }
  .scene-body  { font-size:clamp(12px,2.2vw,14px); line-height:1.45; }
  .scene-formula { margin-top:8px; padding:8px 12px; }
  .scene-formula p { line-height:1.4; }
  #bottomRow { padding-top:8px; }
}
@media (max-width: 860px) and (max-height: 640px) {
  #stage { grid-template-rows:22vh 1fr; grid-template-rows:22dvh 1fr; }
}
</style>
</head>

<div id="stage">
  <div id="sim"></div>

  <div id="narrativeWrap">
    <div id="divider"></div>

    <div id="topMeta">
      <div class="meta-block">
        <div class="meta-label" id="scholarName">
          İbn al-Haytham · Alhazen
          <strong>965 — 1040</strong>
        </div>
        <div class="meta-label" style="margin-top:2px;">
          <em>Kitāb al-Manāẓir</em>
          <strong id="bookLabel">Optiğin Kitabı · 1011–1021</strong>
        </div>
      </div>
      <div class="meta-block" style="align-items:flex-end;">
        <div class="meta-label" id="progressLabel" style="text-align:right;">İlerleme</div>
        <div class="progress-track" id="progressTrack"></div>
        <div id="playbackCtr">
          <button class="ctrl-btn" id="btnPrev" aria-label="Önceki bölüm" title="Önceki (←)">◂</button>
          <button class="ctrl-btn" id="btnPlay" aria-label="Duraklat/Oynat" title="Duraklat/Oynat (Boşluk)">❚❚</button>
          <button class="ctrl-btn" id="btnNext" aria-label="Sonraki bölüm" title="Sonraki (→)">▸</button>
        </div>
        <div class="meta-label" id="timerLabel" style="text-align:right; margin-top:6px;">Sonraki bölüm</div>
        <div id="timerBar" style="margin-top:6px;"><div id="timerFill"></div></div>
      </div>
    </div>

    <div id="sceneArea"></div>

    <div id="bottomRow">
      <div id="authorCredit">
        <strong>Hüseyin Rahmi Göktaş</strong>
        <span id="creditSub">Dijital Enstalasyon, 2025</span>
      </div>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════
   SCENES — tek dil: Türkçe
════════════════════════════════════════════════ */
const SCENES = [
  {
    dur:22, eyebrow:'Tanıtım',
    title:'Modern bilimin\n<em>kurucu</em> zihinlerinden',
    body:`<strong>Ebû Alî el-Hasan ibn el-Heysem</strong> (965–1040), Batı'da <em>Alhazen</em> adıyla bilinir — optik, astronomi, matematik, tıp ve felsefe dahil <strong>yaklaşık 200 eser</strong> yazdı.<br><br>
Kahire'de Fatımî halifesi el-Hâkim, Nil'i düzenleme görevini verdiğinde bunun imkânsız olduğunu görüp <em>delilik taklidi yaparak</em> ev hapsine girdi — ve bu yıllarda devrim niteliğindeki <strong>Kitāb al-Manāẓir</strong>'i (Optiğin Kitabı) yazdı.<br><br>
Şimdi göreceğimiz problem onun en büyük katkısı değil — ama zihninin nasıl çalıştığını gösteren, <em>kolayca anlaşılır</em> küçük ve zarif bir örnek.`,
  },
  {
    dur:18, eyebrow:'Giriş',
    title:'Işık nereden\n<em>yansır?</em>',
    body:`Bir mum ışığı küresel bir aynaya çarpıyor.
Gözünüze ulaşmadan önce aynada tam olarak <em>hangi noktadan</em> sekiyor?<br><br>
Bu soru MS 150'den beri matematikçileri meşgul etti.
<strong>İbn al-Haytham</strong> onu yaklaşık <em>850 yıl sonra</em> yanıtladı — bugün matematik tarihinde
<strong>"İbn Heysem Problemi"</strong> (Alhazen's Problem) adıyla anılıyor.`,
  },
  {
    dur:18, eyebrow:'Adım 1 · Küresel Ayna',
    title:'Mükemmel\nbir yüzey',
    body:`Sahne: hareketli bir küresel ayna.
Yüzeyinin her noktasında <strong>yansıma yasası</strong> geçerlidir —
gelen ışının açısı, giden ışının açısına eşittir.<br><br>
<em>Ama hangi nokta?</em> Sonsuz seçenek var. Yalnızca biri doğrudur.`,
  },
  {
    dur:18, eyebrow:'Adım 2 · İki Nokta',
    title:'Kaynak,\nayna, göz',
    body:`Sarı nokta · ışık kaynağı <strong>S</strong><br>
Mavi nokta · gözlemci <strong>E</strong><br>
Beyaz nokta · hesaplanan <em>yansıma noktası</em> <strong>P</strong><br><br>
Ayna hareket etse de P her an yeniden hesaplanıyor.`,
  },
  {
    dur:20, eyebrow:'Adım 3 · Yansıma Yasası',
    title:'Eşit açı\nkoşulu',
    body:`P noktasındaki normalle gelen ışının açısı
ile giden ışının açısı <strong>birbirine eşit</strong> olmalıdır.<br><br>
Bu basit kısıt, P'yi bulmayı <em>şaşırtıcı ölçüde zor</em> kılar —
çözüm bir <strong>4. derece denklem</strong> gerektirir.`,
    formula:['∠(S, P, N) = ∠(E, P, N)', 'N = Ayna normali, P noktasında'],
  },
  {
    dur:20, eyebrow:'Adım 4 · Geometrik Çözüm',
    title:'İbn Heysem\'in\nçözümü',
    body:`İbn al-Haytham bunu saf geometriyle çözdü: P noktası,
küresel aynanın <strong>bir hiperbolle kesiştiği yerdir.</strong><br><br>
S ve E'yi odak noktaları olarak kullanan bir hiperbol çizeriz.
Bu hiperbolün ayna ile kesiştiği nokta <em>yansıma noktasıdır.</em>`,
    formula:['|SP| − |EP| = sabit  (hiperbol tanımı)', 'Kesişim → yansıma noktası P'],
  },
  {
    dur:20, eyebrow:'Adım 5 · Cebirsel Tamamlanma',
    title:'1965\'e kadar\nbekledi',
    body:`İbn Heysem'in geometrik çözümü MS 1000 civarındaydı.
Cebirsel tam çözüm — dördüncü derece denklem olarak — ancak
<strong>1965'te Jack Elkin</strong> tarafından yazılabildi.<br><br>
<em>Yaklaşık 965 yıl arayla, aynı problem, aynı cevap.</em>`,
    formula:['x⁴ + ax³ + bx² + cx + d = 0', 'Elkin, 1965'],
  },
  {
    dur:20, eyebrow:'Genelleme · Modern Formlar',
    title:'Paraboloid,\nhiperboloid,\nsimit',
    body:`Problem küreyle sınırlı kalmadı. Soldaki animasyondaki farklı ayna formları —
<strong>paraboloid, hiperboloid, torus</strong> — her biri bu problemin genellemesidir.<br><br>
Her form daha yüksek derece denklemler üretir.`,
  },
  {
    dur:20, eyebrow:'Miras · Robotik Çağı',
    title:'Robotların\ngözü',
    body:`2011'de Mitsubishi Electric bu problemi panoramik robot kameraları için genelledi.
Quadrik yüzeylerde çözüm <strong>8. dereceye</strong> yükseliyor.<br><br>
Sonuç: robotların 3D algılama hızı <em>100 kata kadar</em> arttı.<br><br>
<strong>MS 1000 civarındaki bir soru, 2011'de robotlara göz verdi.</strong>`,
    formula:['Küresel → 4. derece', 'Quadrik yüzey → 8. derece'],
  },
  {
    dur:18, eyebrow:'Kapanış · Optiğin Kuruluşu',
    title:'Modern\nbilimin\nilk adımı',
    body:`İbn al-Haytham yalnızca bu problemi çözmedi —
<em>gözlerin ışık yaydığı</em> antik Yunan teorisini yıkarak
<strong>nesnelerden yansıyan ışığın göze ulaştığını</strong> kanıtladı.<br><br>
Deney + geometri + mantık. Bilimsel yöntemin ilk büyük uygulaması. MS 1011.`,
  },
];

/* ════════════════════════════════════════════════
   STATE
════════════════════════════════════════════════ */
let sceneIdx = 0, sceneElapsed = 0, currentCard = null, isPaused = false;

const sceneArea    = document.getElementById('sceneArea');
const timerFill    = document.getElementById('timerFill');
const progressTrack = document.getElementById('progressTrack');

/* ── Progress pips ── */
SCENES.forEach((_,i)=>{
  const p=document.createElement('button');
  p.className='progress-pip'; p.id=`pip-${i}`;
  p.setAttribute('aria-label', `${i+1}. bölüme git`);
  p.addEventListener('click', ()=>showScene(i));
  progressTrack.appendChild(p);
});
function updatePips(idx){
  SCENES.forEach((_,i)=>{
    const p=document.getElementById(`pip-${i}`);
    p.className='progress-pip'+(i<idx?' done':i===idx?' active':'');
  });
}

/* ── Build card ── */
function buildCard(s){
  const d=document.createElement('div');
  d.className='scene-card';
  let h='';
  if(s.eyebrow) h+=`<div class="scene-eyebrow">${s.eyebrow}</div>`;
  h+=`<div class="scene-title">${s.title.replace(/\n/g,'<br>')}</div>`;
  h+=`<div class="scene-body">${s.body}</div>`;
  if(s.formula) h+=`<div class="scene-formula">`+s.formula.map(f=>`<p>${f}</p>`).join('')+`</div>`;
  d.innerHTML=h; return d;
}

function showScene(idx){
  idx = ((idx % SCENES.length) + SCENES.length) % SCENES.length;

  if(currentCard){
    currentCard.classList.remove('entering');
    currentCard.classList.add('exiting');
    const old=currentCard; setTimeout(()=>old.remove(),450);
  }
  sceneIdx=idx; sceneElapsed=0;
  const s=SCENES[idx];
  const card=buildCard(s);
  sceneArea.appendChild(card);
  requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.add('entering')));
  currentCard=card;
  updatePips(idx);
}

showScene(0);

/* ── Playback controls ── */
const btnPlay=document.getElementById('btnPlay'), btnPrev=document.getElementById('btnPrev'), btnNext=document.getElementById('btnNext');
function goPrev(){ showScene(sceneIdx-1); }
function goNext(){ showScene(sceneIdx+1); }
function togglePause(){
  isPaused=!isPaused;
  btnPlay.textContent = isPaused ? '▸' : '❚❚';
  btnPlay.setAttribute('aria-label', isPaused?'Oynat':'Duraklat');
}
btnPrev.addEventListener('click', goPrev);
btnNext.addEventListener('click', goNext);
btnPlay.addEventListener('click', togglePause);
window.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goNext();
  else if(e.key==='ArrowLeft') goPrev();
  else if(e.code==='Space'){ e.preventDefault(); togglePause(); }
});

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ── Timer loop ── */
let lastT=0;
function narrativeLoop(now){
  requestAnimationFrame(narrativeLoop);
  const dt=Math.min((now-lastT)/1000,0.05); lastT=now;
  if(!isPaused){
    sceneElapsed+=dt;
    const s=SCENES[sceneIdx];
    timerFill.style.width=(Math.min(sceneElapsed/s.dur,1)*100)+'%';
    if(sceneElapsed>=s.dur) showScene(sceneIdx+1);
  }
}
requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(narrativeLoop);});
</script>

const containerElem = document.getElementById('sim');
const prefersReducedMotion3D = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let scene,camera,renderer,controls,composer,clock;
let mirror,reflectionPoint,starField,wireframe,rayTube1,rayTube2;

const shapes=[
  {create:()=>new THREE.SphereGeometry(mirrorRadius,64,32)},
  {create:()=>new ParametricGeometry((u,v,t)=>{const r=u*mirrorRadius,z=-0.01*r*r+70,a=v*Math.PI*2;t.set(r*Math.cos(a),r*Math.sin(a),z);},64,64)},
  {create:()=>new ParametricGeometry((u,v,t)=>{const a=80,c=60,ang=u*Math.PI*2,h=(v-0.5)*200,r=a*Math.sqrt(1+(h/c)*(h/c));t.set(r*Math.cos(ang),r*Math.sin(ang),h);},64,64)},
  {create:()=>new THREE.TorusGeometry(mirrorRadius-20,40,64,100)},
];

function init(){
  scene=new THREE.Scene(); clock=new THREE.Clock();
  camera=new THREE.PerspectiveCamera(75,containerElem.clientWidth/containerElem.clientHeight,0.1,2000);
  camera.position.z=350;
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(containerElem.clientWidth,containerElem.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping=THREE.ReinhardToneMapping;
  containerElem.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,0.2));
  const pl=new THREE.PointLight(0xffffff,0.8); camera.add(pl); scene.add(camera);
  controls=new OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=0.05;
  const bp=new UnrealBloomPass(new THREE.Vector2(containerElem.clientWidth,containerElem.clientHeight),1.5,0.4,0.85);
  bp.threshold=0; bp.strength=2.0; bp.radius=0.5;
  composer=new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera)); composer.addPass(bp);
  const mm=new THREE.MeshPhongMaterial({color:0xAAAAFF,transparent:true,opacity:0.15,shininess:100,side:THREE.DoubleSide});
  mirror=new THREE.Mesh(shapes[0].create(),mm); scene.add(mirror);
  wireframe=new THREE.LineSegments(new THREE.WireframeGeometry(mirror.geometry),new THREE.LineBasicMaterial({color:0xFBBF24,transparent:true,opacity:0.3})); scene.add(wireframe);
  const pg=new THREE.SphereGeometry(8,32,16);
  sourceData.mesh=new THREE.Mesh(pg,new THREE.MeshBasicMaterial({color:sourceData.color,toneMapped:false}));
  sourceData.mesh.position.set(-100,50,80); scene.add(sourceData.mesh);
  targetData.mesh=new THREE.Mesh(pg,new THREE.MeshBasicMaterial({color:targetData.color,toneMapped:false}));
  targetData.mesh.position.set(120,-80,-50); scene.add(targetData.mesh);
  reflectionPoint=new THREE.Mesh(new THREE.SphereGeometry(5,16,8),new THREE.MeshBasicMaterial({color:0xffffff,toneMapped:false})); scene.add(reflectionPoint);
  rayTube1=new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(new THREE.Vector3(),new THREE.Vector3()),2,2,8,false),new THREE.MeshBasicMaterial({color:sourceData.color,toneMapped:false})); scene.add(rayTube1);
  rayTube2=new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(new THREE.Vector3(),new THREE.Vector3()),2,2,8,false),new THREE.MeshBasicMaterial({color:targetData.color,toneMapped:false})); scene.add(rayTube2);
  const sv=[];
  for(let i=0;i<10000;i++) sv.push(THREE.MathUtils.randFloatSpread(2000),THREE.MathUtils.randFloatSpread(2000),THREE.MathUtils.randFloatSpread(2000));
  const sg=new THREE.BufferGeometry(); sg.setAttribute('position',new THREE.Float32BufferAttribute(sv,3));
  starField=new THREE.Points(sg,new THREE.PointsMaterial({color:0x888888,size:0.7})); scene.add(starField);
  mirrorData.velocity.set((Math.random()-0.5)*0.2,(Math.random()-0.5)*0.2,(Math.random()-0.5)*0.2);
  window.addEventListener('resize',()=>{
    camera.aspect=containerElem.clientWidth/containerElem.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(containerElem.clientWidth,containerElem.clientHeight);
    composer.setSize(containerElem.clientWidth,containerElem.clientHeight);
  });
}

function animate(){
  requestAnimationFrame(animate);
  const delta=clock.getDelta();
  const motionScale = prefersReducedMotion3D ? 0.15 : 1;
  shapeChangeTimer+=delta;
  if(shapeChangeTimer>SHAPE_CHANGE_INTERVAL){
    currentShapeIndex=(currentShapeIndex+1)%shapes.length;
    const ng=shapes[currentShapeIndex].create();
    mirror.geometry.dispose(); wireframe.geometry.dispose();
    mirror.geometry=ng; wireframe.geometry=new THREE.WireframeGeometry(ng);
    shapeChangeTimer=0;
  }
  [sourceData,targetData].forEach(d=>{
    d.mesh.position.addScaledVector(d.velocity, motionScale);
    if(Math.abs(d.mesh.position.x)>bounds) d.velocity.x*=-1;
    if(Math.abs(d.mesh.position.y)>bounds) d.velocity.y*=-1;
    if(Math.abs(d.mesh.position.z)>bounds) d.velocity.z*=-1;
  });
  const mb=50;
  mirror.position.addScaledVector(mirrorData.velocity, motionScale);
  wireframe.position.copy(mirror.position); wireframe.rotation.copy(mirror.rotation);
  if(Math.abs(mirror.position.x)>mb) mirrorData.velocity.x*=-1;
  if(Math.abs(mirror.position.y)>mb) mirrorData.velocity.y*=-1;
  if(Math.abs(mirror.position.z)>mb) mirrorData.velocity.z*=-1;
  mirror.updateMatrixWorld(); // matrixWorld is otherwise only refreshed during render,
                              // which would make this frame's search use last frame's position
  let bestPt=new THREE.Vector3(),minD=Infinity;
  const pos=mirror.geometry.attributes.position, v=new THREE.Vector3();
  for(let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos,i).applyMatrix4(mirror.matrixWorld);
    const d=sourceData.mesh.position.distanceTo(v)+targetData.mesh.position.distanceTo(v);
    if(d<minD){minD=d;bestPt.copy(v);}
  }
  reflectionPoint.position.copy(bestPt);
  rayTube1.geometry.dispose();
  rayTube1.geometry=new THREE.TubeGeometry(new THREE.LineCurve3(sourceData.mesh.position,bestPt),2,2,8,false);
  rayTube2.geometry.dispose();
  rayTube2.geometry=new THREE.TubeGeometry(new THREE.LineCurve3(bestPt,targetData.mesh.position),2,2,8,false);
  starField.rotation.x+=0.0001*motionScale; starField.rotation.y+=0.0002*motionScale;
  controls.update(); composer.render();
}

init(); animate();
</script>
</body>
</html>
