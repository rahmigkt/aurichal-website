<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Hüseyin Rahmi Göktaş">
<meta name="copyright" content="© 2025 Hüseyin Rahmi Göktaş — MUKANTARA. Tüm hakları saklıdır.">
<title>Al-Bīrūnī — Ay'ın Döngüsü</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100vh; height:100dvh; overflow:hidden; background:#06070d; color:#c8cdd8; font-family:'Cormorant Garamond',Georgia,serif; -webkit-font-smoothing:antialiased; }
@media (prefers-reduced-motion: reduce) { .sc { transition-duration: 0.01ms !important; } }

#stage { position:fixed; inset:0; display:grid; grid-template-columns:55% 45%; }

/* LEFT */
#canvasWrap { position:relative; overflow:hidden; }
#canvasWrap::after {
  content:''; position:absolute; inset:0; pointer-events:none;
  background: linear-gradient(to right, transparent 62%, rgba(6,7,13,0.88) 100%);
}
#cv { position:absolute; inset:0; width:100%; height:100%; display:block; }

#divider {
  position:absolute; top:10%; bottom:10%; right:0; width:1px;
  background:linear-gradient(to bottom, transparent, rgba(232,201,122,0.18) 30%, rgba(232,201,122,0.18) 70%, transparent);
}

/* RIGHT */
#rw {
  position:relative; display:flex; flex-direction:column;
  height:100%; padding:clamp(18px,4vh,48px) clamp(18px,5vw,56px) clamp(16px,3.5vh,40px) clamp(18px,4.5vw,52px);
  overflow:hidden;
}
#rw::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(circle, rgba(255,255,255,0.022) 1px, transparent 1px);
  background-size:40px 40px;
}

/* TOP */
#tm {
  flex-shrink:0; display:flex; align-items:flex-start;
  justify-content:space-between; position:relative; z-index:2;
  padding-bottom:clamp(12px,2vh,24px); border-bottom:1px solid rgba(255,255,255,0.05);
  flex-wrap:wrap; row-gap:10px;
}
.mb { display:flex; flex-direction:column; gap:5px; }
.ml { font-family:'Courier Prime',monospace; font-size:clamp(9px,0.95vw,11px); letter-spacing:0.35em; text-transform:uppercase; color:rgba(200,205,216,0.42); line-height:1.9; }
.ml strong { display:block; color:rgba(200,205,216,0.68); font-weight:400; }
.ml em { font-style:italic; color:rgba(200,205,216,0.45); }

.pt { display:flex; align-items:center; gap:5px; margin-top:8px; }
.pp { height:8px; width:20px; display:flex; align-items:center; cursor:pointer; padding:0; background:none; border:none; }
.pp::before { content:''; display:block; width:100%; height:1px; background:rgba(200,205,216,0.12); transition:background 0.7s,width 0.7s,height 0.2s; }
.pp:hover::before { height:2px; background:rgba(200,205,216,0.4); }
.pp.done::before { background:rgba(200,205,216,0.5); }
.pp.active::before { background:#e8c97a; width:32px; }

/* Playback controls */
#ctr { display:flex; align-items:center; gap:12px; margin-top:8px; }
.cb {
  background:none; border:1px solid rgba(200,205,216,0.25); color:rgba(200,205,216,0.65);
  width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:11px; font-family:'Courier Prime',monospace;
  transition:border-color 0.3s, color 0.3s, background 0.3s;
}
.cb:hover { border-color:rgba(232,201,122,0.6); color:#e8c97a; background:rgba(232,201,122,0.08); }
.cb:focus-visible { outline:1px solid #e8c97a; outline-offset:2px; }

/* SCENE */
#sa { flex:1 1 0; position:relative; z-index:2; overflow:hidden; min-height:0; }
.sc {
  position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
  padding:clamp(10px,2vh,28px) 0; opacity:0; transform:translateY(16px);
  transition:opacity 0.55s cubic-bezier(0.22,1,0.36,1), transform 0.55s cubic-bezier(0.22,1,0.36,1);
  pointer-events:none; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none; -webkit-overflow-scrolling:touch;
}
.sc::-webkit-scrollbar { display:none; }
.sc.in  { opacity:1; transform:translateY(0); pointer-events:auto; }
.sc.out { opacity:0; transform:translateY(-16px); transition:opacity 0.4s ease, transform 0.4s ease; }

.se { font-family:'Courier Prime',monospace; font-size:clamp(8px,0.9vw,10px); letter-spacing:0.5em; text-transform:uppercase; color:#e8c97a; opacity:0.75; margin-bottom:clamp(8px,1.6vh,18px); flex-shrink:0; }
.st { font-size:clamp(26px,4.6vw,52px); font-weight:300; line-height:1.12; letter-spacing:0.01em; color:#f0f2f5; margin-bottom:clamp(10px,2vh,24px); flex-shrink:0; }
.st em { font-style:italic; color:#e8c97a; }
.sb { font-size:clamp(14px,1.7vw,19px); font-weight:300; line-height:1.7; color:rgba(200,205,216,0.68); flex-shrink:0; }
.sb em { font-style:italic; color:rgba(220,225,235,0.9); }
.sb strong { font-weight:600; color:rgba(232,201,122,0.88); font-style:normal; }
.sf { margin-top:clamp(10px,1.8vh,20px); padding:clamp(10px,1.6vh,14px) clamp(12px,1.8vw,18px); border-left:2px solid rgba(232,201,122,0.28); background:rgba(232,201,122,0.035); border-radius:0 5px 5px 0; flex-shrink:0; }
.sf p { font-family:'Courier Prime',monospace; font-size:clamp(11px,1.1vw,13px); letter-spacing:0.06em; color:rgba(232,201,122,0.72); line-height:1.7; }

/* BOTTOM */
#br { flex-shrink:0; display:flex; align-items:flex-end; justify-content:space-between; position:relative; z-index:2; padding-top:clamp(10px,2vh,20px); border-top:1px solid rgba(255,255,255,0.05); flex-wrap:wrap; row-gap:8px; }
#ac { font-style:italic; font-size:clamp(11px,1.3vw,14px); letter-spacing:0.08em; color:rgba(200,205,216,0.28); line-height:1.9; }
#ac strong { font-style:normal; font-weight:400; font-size:clamp(12px,1.4vw,15px); color:rgba(200,205,216,0.48); display:block; }
#tw { text-align:right; }
.tl { font-family:'Courier Prime',monospace; font-size:9px; letter-spacing:0.4em; color:rgba(200,205,216,0.2); text-transform:uppercase; display:block; margin-bottom:8px; }
#tb { width:100px; height:1px; background:rgba(200,205,216,0.08); position:relative; overflow:hidden; margin-left:auto; }
#tf { position:absolute; left:0; top:0; height:100%; background:rgba(232,201,122,0.55); width:0%; transition:width 0.25s linear; }

/* NARROW SCREENS — stack canvas above text instead of squeezing it into 45% width */
@media (max-width: 860px) {
  #stage { grid-template-columns:1fr; grid-template-rows:34vh 1fr; grid-template-rows:34dvh 1fr; }
  #canvasWrap::after { background: linear-gradient(to bottom, transparent 45%, rgba(6,7,13,0.92) 100%); }
  #divider { display:none; }
  #rw { padding:16px 18px 14px 18px; }
  .st { font-size:clamp(24px,7vw,36px); }
  .sb { font-size:clamp(13px,3.6vw,16px); }
}

/* SHORT SCREENS — vertical space is the scarce resource here, independent of width.
   Only touches type scale/spacing, never the grid structure, so it's safe to combine
   with either the wide side-by-side layout or the narrow stacked one above. */
@media (max-height: 640px) {
  #rw { padding-top:10px; padding-bottom:10px; }
  #tm { padding-bottom:8px; }
  .se { font-size:8px; margin-bottom:6px; }
  .st { font-size:clamp(20px,4vw,28px); line-height:1.05; margin-bottom:8px; }
  .sb { font-size:clamp(12px,2.2vw,14px); line-height:1.45; }
  .sf { margin-top:8px; padding:8px 12px; }
  .sf p { line-height:1.4; }
  #br { padding-top:8px; }
}

/* NARROW *and* SHORT together — the canvas row itself also needs to shrink here,
   scoped so it never leaks into the wide two-column layout. */
@media (max-width: 860px) and (max-height: 640px) {
  #stage { grid-template-rows:22vh 1fr; grid-template-rows:22dvh 1fr; }
}
</style>
</head>
<body>
<div id="stage">
  <div id="canvasWrap">
    <canvas id="cv"></canvas>
    <div id="divider"></div>
  </div>
  <div id="rw">
    <div id="tm">
      <div class="mb">
        <div class="ml">Abū Rayḥān al-Bīrūnī<strong>973 — 1048</strong></div>
        <div class="ml"><em>Kitāb al-Tafhīm</em><strong id="bkl">Astronomi Ansiklopedisi · 1031</strong></div>
      </div>
      <div class="mb" style="align-items:flex-end;">
        <div class="ml" id="pll" style="text-align:right;">İlerleme</div>
        <div class="pt" id="pt"></div>
        <div id="ctr">
          <button class="cb" id="bPrev" aria-label="Önceki bölüm" title="Önceki (←)">◂</button>
          <button class="cb" id="bPlay" aria-label="Duraklat/Oynat" title="Duraklat/Oynat (Boşluk)">❚❚</button>
          <button class="cb" id="bNext" aria-label="Sonraki bölüm" title="Sonraki (→)">▸</button>
        </div>
        <div class="ml" id="tll" style="text-align:right;margin-top:6px;">Sonraki bölüm</div>
        <div id="tb" style="margin-top:6px;"><div id="tf"></div></div>
      </div>
    </div>
    <div id="sa"></div>
    <div id="br">
      <div id="ac"><strong>Hüseyin Rahmi Göktaş</strong><span id="cs">Dijital Enstalasyon, 2025</span></div>
    </div>
  </div>
</div>
<script>
/* ── DATA (tek dil: Türkçe) ──────────────────────── */
const D = {
  bkl:'Astronomi Ansiklopedisi · 1031', pll:'İlerleme', tll:'Sonraki bölüm',
  cs:'Dijital Enstalasyon, 2025', day:'Gün',
  sun:'GÜNEŞ', earth:'DÜNYA',
  phases:['Yeni Ay','Büyüyen Hilal','İlk Dördün','Büyüyen Şişkin','Dolunay','Küçülen Şişkin','Son Dördün','Küçülen Hilal'],
  sc:[
    { d:20, ey:'Tanıtım', ti:'Bin yılın\n<em>en büyük</em> zihinlerinden',
      bo:'<strong>Ebû Reyhân el-Bīrūnī</strong> (973–1048) astronomi, matematik, jeodezi, mineraloji, eczacılık, tarih ve karşılaştırmalı dinler tarihi dahil onlarca alanda eser verdi — 150\'den fazla eser, günümüze ulaşan ~30\'u.<br><br>Tek bir dağın tepesinden yaptığı açı ölçümüyle <strong>Dünya\'nın yarıçapını</strong> hesapladı; sonuç modern değere şaşırtıcı derecede yakındı. Hindistan\'a gidip Sanskritçe öğrendi, dönemin en titiz karşılaştırmalı kültür incelemelerinden birini yazdı.<br><br>Şimdi göreceğimiz Ay döngüsü çözümlemesi, bu devasa mirasın <em>yalnızca bir parçası.</em>' },
    { d:16, ey:'Giriş', ti:'29 günde\nbir <em>devir</em>',
      bo:'Her gece gökyüzüne baktığınızda Ay biraz farklıdır. Bazen ince bir hilal, bazen tam bir disk, bazen yok.<br><br><em>Bīrūnī</em>, bu döngüyü sistematik gözlem ve matematikle tam olarak açıklayanlardan biridir.' },
    { d:18, ey:'Adım 1 · Güneş ve Işık', ti:'Her şey\nışıkla başlar',
      bo:'Ay kendi ışığını üretmez. <strong>Güneş ışığını yansıtır.</strong><br><br>Görünen şekli, Dünya\'dan bakıldığında Güneş-Ay-Dünya açısına bağlıdır. Bu açı sürekli değişir — çünkü Ay Dünya\'nın etrafında döner.' },
    { d:18, ey:'Adım 2 · Yeni Ay', ti:'Karanlık\nbaşlangıç',
      bo:'Ay Güneş ile Dünya arasındayken, aydınlık yüzü bize dönmez. <strong>Yeni Ay</strong> — gökyüzünde Ay yokmuş gibi görünür.<br><br><em>Bu, 29.53 günlük döngünün sıfır noktasıdır.</em>' },
    { d:18, ey:'Adım 3 · Hilal', ti:'İnce bir\n<em>kavis</em>',
      bo:'Ay yörüngesinde ilerledikçe, Güneş\'in aydınlattığı yüzeyin küçük bir kısmı Dünya\'ya bakar.<br><br><strong>Büyüyen hilal</strong> — her gece biraz daha geniş. Bīrūnī bu şekilleri takvim hesapları için titizlikle kayıt etti.' },
    { d:18, ey:'Adım 4 · İlk Dördün', ti:'Yarım ay\n— ama neden?',
      bo:'Ay-Dünya-Güneş açısı 90° olduğunda, yarısı aydınlık yarısı karanlık.<br><br><strong>İlk Dördün</strong> — döngünün tam çeyreği. Bīrūnī, bu evrelerin tarihlerini hesaplamak için titiz trigonometrik yöntemler geliştirdi; eserlerinde takvim hesaplarına dayanak oluşturacak tablolar bıraktı.',
      fo:['Sinodik ay: 29 gün 12 saat 44 dakika'] },
    { d:18, ey:'Adım 5 · Dolunay', ti:'Tam\n<em>aydınlık</em>',
      bo:'Dünya Güneş ile Ay arasına girdiğinde, aydınlık yarıküre tamamen bize dönük.<br><br><strong>Dolunay.</strong> En parlak gece. Bīrūnī ay tutulmalarını tam bu geometriden açıkladı: Dünya\'nın gölgesi Ay\'ın üzerinden geçer.' },
    { d:18, ey:'Adım 6 · Küçülme', ti:'Geri\ndönüş',
      bo:'Dolunay\'dan sonra Ay yavaşça karanlığa çekilir. <strong>Küçülen şişkin, son dördün, küçülen hilal</strong> — aynı aşamalar ters yönde.<br><br><em>29.53 günün sonunda döngü kapanır. Yeni Ay yeniden başlar.</em>' },
    { d:20, ey:'Bīrūnī\'nin Katkısı', ti:'Ay\'ın\ngeometrisini\nçözen adam',
      bo:'Bīrūnī yalnızca evreleri gözlemlemedi — Ay-Güneş-Dünya sisteminin <strong>tam geometrisini</strong> kurdu.<br><br>Ay tutulmalarını coğrafi boylamı hesaplamak için kullandı — Bağdat ile Gazne arasındaki boylam farkını bu yöntemle buldu. Gelgitlerin Ay ile ilişkisini doğru kurdu.',
      fo:['Sinodik ay: 29.53 gün  (Dünya\'ya göre)','Yıldızıl ay: 27.32 gün  (yıldızlara göre)'] },
    { d:18, ey:'Miras', ti:'1000 yıl\nönce\nkurulan\ngeometri',
      bo:'Bīrūnī\'nin gözlemleri, çağının çok ötesinde bir titizlik taşıyordu — ay evrelerinden Dünya\'nın yarıçapına, tutulmalardan coğrafi boylamlara kadar geniş bir alanda titiz ölçüm ve hesap bıraktı.<br><br><strong>973\'te doğan bir adam</strong>, modern astronominin çok sonra doğrulayacağı sonuçlara, elindeki aletler ve saf matematikle ulaşmıştı.' },
  ]
};

/* ── NARRATIVE ─────────────────────────────────── */
const ptEl = document.getElementById('pt');
D.sc.forEach((_,i)=>{
  const p=document.createElement('button');
  p.className='pp'; p.id='p'+i;
  p.setAttribute('aria-label', `${i+1}. bölüme git`);
  p.addEventListener('click', ()=>showSc(i));
  ptEl.appendChild(p);
});
function upPips(idx){
  D.sc.forEach((_,i)=>{
    const p=document.getElementById('p'+i);
    p.className='pp'+(i<idx?' done':i===idx?' active':'');
  });
}

let sIdx=0, sEl=0, curCard=null, hlPhase=-1, isPaused=false;
/* Sahne indeksi -> halkadaki doğru Ay evresi indeksi eşleşmesi.
   -1: bu sahnenin belirli bir tek evreyle eşleşmediği anlamına gelir (genel anlatım). */
const PHASE_MAP = [-1, -1, -1, 0, 1, 2, 4, 6, -1, -1];
const sa=document.getElementById('sa');
const tf=document.getElementById('tf');

function mkCard(s){
  const d=document.createElement('div');
  d.className='sc';
  let h='';
  if(s.ey) h+=`<div class="se">${s.ey}</div>`;
  h+=`<div class="st">${s.ti.replace(/\n/g,'<br>')}</div>`;
  h+=`<div class="sb">${s.bo}</div>`;
  if(s.fo) h+=`<div class="sf">`+s.fo.map(f=>`<p>${f}</p>`).join('')+`</div>`;
  d.innerHTML=h; return d;
}

function showSc(idx){
  const sc=D.sc;
  idx=((idx%sc.length)+sc.length)%sc.length;
  if(curCard){
    curCard.classList.remove('in'); curCard.classList.add('out');
    const old=curCard; setTimeout(()=>old.remove(),450);
  }
  sIdx=idx; sEl=0;
  const card=mkCard(sc[idx]);
  sa.appendChild(card);
  requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.add('in')));
  curCard=card; upPips(idx);
  hlPhase=PHASE_MAP[idx] ?? -1; // metinle eşleşen doğru evreyi vurgula
}

document.getElementById('bkl').textContent=D.bkl;
document.getElementById('pll').textContent=D.pll;
document.getElementById('tll').textContent=D.tll;
document.getElementById('cs').textContent=D.cs;
showSc(0);

/* ── PLAYBACK CONTROLS ───────────────────────────── */
const bPlay=document.getElementById('bPlay'), bPrev=document.getElementById('bPrev'), bNext=document.getElementById('bNext');
function goPrev(){ showSc(sIdx-1); }
function goNext(){ showSc(sIdx+1); }
function togglePause(){
  isPaused=!isPaused;
  bPlay.textContent = isPaused ? '▸' : '❚❚';
  bPlay.setAttribute('aria-label', isPaused?'Oynat':'Duraklat');
}
bPrev.addEventListener('click', goPrev);
bNext.addEventListener('click', goNext);
bPlay.addEventListener('click', togglePause);
window.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goNext();
  else if(e.key==='ArrowLeft') goPrev();
  else if(e.code==='Space'){ e.preventDefault(); togglePause(); }
});

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let lastN=0;
function nLoop(now){
  requestAnimationFrame(nLoop);
  const dt=Math.min((now-lastN)/1000,0.05); lastN=now;
  if(!isPaused){
    sEl+=dt;
    const dur=D.sc[sIdx].d;
    tf.style.width=(Math.min(sEl/dur,1)*100)+'%';
    if(sEl>=dur) showSc(sIdx+1);
  }
}
requestAnimationFrame(t=>{lastN=t; requestAnimationFrame(nLoop);});

/* ── CANVAS ────────────────────────────────────── */
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
const DPR = Math.min(window.devicePixelRatio||1, 2);
let W=0, H=0;
let mAngle  = -Math.PI/2; // start at top

function resize(){
  W=cv.offsetWidth; H=cv.offsetHeight;
  cv.width =W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();
window.addEventListener('resize',()=>{ resize(); mkStars(); });

/* Stars — generate once */
let stars=[];
function mkStars(){
  stars=[];
  for(let i=0;i<340;i++){
    stars.push({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.1+0.2,
      a:0.08+Math.random()*0.5,
      twinkle:Math.random()*Math.PI*2
    });
  }
}
mkStars();

/* Draw correct moon phase:
   sunAngle = direction toward sun from earth (we fix sun on right, angle=0)
   moonAngle = moon's orbital angle
   illuminated fraction & which side depends on (moonAngle - sunAngle) */
function drawMoonDisc(cx,cy,r,orbAngle,alpha){
  ctx.save();
  ctx.globalAlpha=alpha;

  // Moon base gradient — lit from sun direction
  // Sun is to the right (positive x), so lit side is toward angle=0
  const litDir = 0; // sun angle from earth = 0 (right)
  const relAngle = orbAngle - litDir; // moon position relative to sun

  // Phase: 0=new(between sun&earth), π=full(opposite sun)
  // When moon is at angle=π (left of earth), it's fully lit from our view
  const phase = (Math.cos(relAngle + Math.PI) + 1) / 2; // 0=new, 1=full

  // Normalize angle to [0, 2π) so the waxing/waning side can be determined
  const na = ((relAngle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);

  // Base surface
  const bg = ctx.createRadialGradient(cx-r*0.15,cy-r*0.15,r*0.05,cx,cy,r);
  bg.addColorStop(0,'#ede8d8');
  bg.addColorStop(0.5,'#c8c0a8');
  bg.addColorStop(1,'#8a8070');
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle=bg; ctx.fill();

  // Clip shadow
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();

  // Shadow circle — same radius as the moon, offset horizontally.
  // At offset 0 the two circles coincide exactly (100% shadow = New Moon).
  // At offset 2r the circles no longer overlap at all (0% shadow = Full Moon).
  // The offset direction flips at Full Moon so the shadow recedes from the
  // opposite side while waning (otherwise the crescent would grow back on
  // the wrong side of the disc).
  const offsetMag = r * (1 - Math.cos(na)); // 0 → 2r as na goes 0 → π
  const sign = na <= Math.PI ? 1 : -1;
  const sOffX = cx + sign*offsetMag; // shadow center x
  const sR    = r;

  const sh = ctx.createRadialGradient(sOffX,cy,0,sOffX,cy,sR*1.6);
  sh.addColorStop(0,'rgba(6,7,18,0.98)');
  sh.addColorStop(0.55,'rgba(6,7,18,0.92)');
  sh.addColorStop(1,'rgba(6,7,18,0.0)');
  ctx.beginPath(); ctx.arc(sOffX,cy,sR,0,Math.PI*2);
  ctx.fillStyle=sh; ctx.fill();
  ctx.restore();

  // Subtle craters
  const crats=[{px:-0.22,py:-0.18,pr:0.11},{px:0.18,py:0.22,pr:0.09},{px:-0.05,py:0.32,pr:0.07},{px:0.3,py:-0.25,pr:0.06}];
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();
  ctx.globalAlpha*=0.6;
  crats.forEach(c=>{
    ctx.beginPath(); ctx.arc(cx+c.px*r,cy+c.py*r,c.pr*r,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx+c.px*r-c.pr*r*0.3,cy+c.py*r-c.pr*r*0.3,c.pr*r*0.5,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fill();
  });
  ctx.restore();

  // Limb glow
  const lg=ctx.createRadialGradient(cx,cy,r*0.75,cx,cy,r*1.2);
  lg.addColorStop(0,'rgba(240,235,215,0)');
  lg.addColorStop(0.85,'rgba(240,235,215,0.07)');
  lg.addColorStop(1,'rgba(240,235,215,0)');
  ctx.beginPath(); ctx.arc(cx,cy,r*1.2,0,Math.PI*2);
  ctx.fillStyle=lg; ctx.fill();

  ctx.globalAlpha=1; ctx.restore();
}

function drawFrame(ts){
  // Background
  ctx.fillStyle='#06070d'; ctx.fillRect(0,0,W,H);

  // Starfield with subtle twinkle
  stars.forEach((s,i)=>{
    const tw=0.5+0.5*Math.sin(s.twinkle+ts*0.0008+i*0.3);
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(210,215,235,${s.a*tw})`; ctx.fill();
  });

  const cx=W*0.46, cy=H*0.5;
  const OR = Math.min(W,H)*0.33; // orbit radius
  const MR = OR*0.115;            // moving moon radius
  const SR = OR*0.10;             // static moon radius
  const ER = OR*0.085;            // earth radius

  // Orbit ring
  ctx.beginPath(); ctx.arc(cx,cy,OR,0,Math.PI*2);
  ctx.strokeStyle='rgba(80,90,140,0.15)'; ctx.lineWidth=1;
  ctx.setLineDash([3,9]); ctx.stroke(); ctx.setLineDash([]);

  // Static phase moons (8 around orbit)
  const t=D;
  for(let i=0;i<8;i++){
    const a=(i/8)*Math.PI*2;
    const mx=cx+OR*Math.cos(a), my=cy+OR*Math.sin(a);
    const isHl=(hlPhase>=0 && i===hlPhase);
    const alp=isHl?0.95:0.22;

    // Highlight halo
    if(isHl){
      const hg=ctx.createRadialGradient(mx,my,SR,mx,my,SR*3);
      hg.addColorStop(0,'rgba(232,201,122,0.2)');
      hg.addColorStop(1,'rgba(232,201,122,0)');
      ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(mx,my,SR*3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(mx,my,SR+2,0,Math.PI*2);
      ctx.strokeStyle='rgba(232,201,122,0.35)'; ctx.lineWidth=1; ctx.stroke();
    }

    drawMoonDisc(mx,my,SR,a,alp);

    // Label
    const ld=SR*2.6;
    const lx=cx+(OR+ld)*Math.cos(a), ly=cy+(OR+ld)*Math.sin(a);
    ctx.font=isHl?'bold 10px "Courier Prime",monospace':'9px "Courier Prime",monospace';
    ctx.fillStyle=isHl?'rgba(232,201,122,0.9)':'rgba(180,185,205,0.25)';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(t.phases[i],lx,ly);
  }

  // ── Animated moon orbit trail ──
  const trailLen=0.6;
  const grad=ctx.createLinearGradient(0,0,W,0);
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,OR,mAngle-trailLen,mAngle,false);
  ctx.strokeStyle='rgba(232,201,122,0.2)'; ctx.lineWidth=3; ctx.stroke();
  ctx.restore();

  // Animated moon position
  const mx=cx+OR*Math.cos(mAngle), my=cy+OR*Math.sin(mAngle);

  // Glow behind moving moon
  const mg=ctx.createRadialGradient(mx,my,MR*0.5,mx,my,MR*3.5);
  mg.addColorStop(0,'rgba(245,238,215,0.22)');
  mg.addColorStop(0.4,'rgba(245,238,215,0.06)');
  mg.addColorStop(1,'rgba(245,238,215,0)');
  ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(mx,my,MR*3.5,0,Math.PI*2); ctx.fill();

  drawMoonDisc(mx,my,MR*1.28,mAngle,1);

  // Moving moon ring
  ctx.beginPath(); ctx.arc(mx,my,MR*1.28+2,0,Math.PI*2);
  ctx.strokeStyle='rgba(232,201,122,0.22)'; ctx.lineWidth=1; ctx.stroke();

  // ── Earth ──
  const eg=ctx.createRadialGradient(cx-ER*0.25,cy-ER*0.25,ER*0.1,cx,cy,ER);
  eg.addColorStop(0,'#5ab0ff');
  eg.addColorStop(0.35,'#1a70d4');
  eg.addColorStop(0.75,'#0d4e92');
  eg.addColorStop(1,'#062444');
  const egl=ctx.createRadialGradient(cx,cy,ER*0.8,cx,cy,ER*2.2);
  egl.addColorStop(0,'rgba(30,120,255,0.18)');
  egl.addColorStop(1,'rgba(30,120,255,0)');
  ctx.fillStyle=egl; ctx.beginPath(); ctx.arc(cx,cy,ER*2.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,ER,0,Math.PI*2);
  ctx.fillStyle=eg; ctx.fill();
  ctx.strokeStyle='rgba(80,160,255,0.45)'; ctx.lineWidth=1.5; ctx.stroke();

  // Continents
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,ER,0,Math.PI*2); ctx.clip();
  [[-.2,-.2,.28,.18,0.35],[.08,.12,.22,.28,0.32],[-.32,.06,.17,.22,0.28]].forEach(c=>{
    ctx.beginPath();
    ctx.ellipse(cx+c[0]*ER,cy+c[1]*ER,c[2]*ER,c[3]*ER,c[4],0,Math.PI*2);
    ctx.fillStyle='rgba(35,165,85,0.48)'; ctx.fill();
  });
  ctx.restore();

  // Earth label
  ctx.font='9px "Courier Prime",monospace';
  ctx.fillStyle='rgba(180,195,225,0.35)';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(t.earth,cx,cy+ER+6);

  // ── Sun (right side) ──
  const sx=W*0.88, sy=H*0.14;
  const sR=W*0.03;
  const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,sR*3);
  sg.addColorStop(0,'rgba(255,200,50,0.95)');
  sg.addColorStop(0.3,'rgba(255,150,20,0.5)');
  sg.addColorStop(0.7,'rgba(255,100,0,0.15)');
  sg.addColorStop(1,'rgba(255,80,0,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sx,sy,sR*3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx,sy,sR,0,Math.PI*2);
  const sc2=ctx.createRadialGradient(sx-sR*0.3,sy-sR*0.3,sR*0.1,sx,sy,sR);
  sc2.addColorStop(0,'#fff5c0'); sc2.addColorStop(1,'#ff9900');
  ctx.fillStyle=sc2; ctx.fill();
  // Sun rays
  for(let i=0;i<8;i++){
    const ra=(i/8)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(sx+Math.cos(ra)*(sR+3),sy+Math.sin(ra)*(sR+3));
    ctx.lineTo(sx+Math.cos(ra)*(sR+11),sy+Math.sin(ra)*(sR+11));
    ctx.strokeStyle='rgba(255,200,50,0.5)'; ctx.lineWidth=1.5; ctx.stroke();
  }
  ctx.font='9px "Courier Prime",monospace';
  ctx.fillStyle='rgba(255,200,80,0.45)';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(t.sun, sx, sy+sR+8);

  // Light rays from sun toward earth/moon area
  ctx.save();
  ctx.globalAlpha=0.06;
  ctx.strokeStyle='#ffcc44'; ctx.lineWidth=40;
  ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(cx,cy);
  ctx.stroke();
  ctx.restore();

  // ── Day counter ──
  const frac=((mAngle%(Math.PI*2))+Math.PI*2)%(Math.PI*2)/(Math.PI*2);
  const dayNum=Math.floor(frac*29.53);
  ctx.font='bold 12px "Courier Prime",monospace';
  ctx.fillStyle='rgba(232,201,122,0.5)';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillText(`${t.day} ${dayNum}`, cx, H-14);
}

// Animation loop
let lastG=0;
function gLoop(now){
  requestAnimationFrame(gLoop);
  const dt=Math.min((now-lastG)/1000,0.05); lastG=now;
  if(!isPaused){
    stars.forEach(s=>{ s.twinkle+=dt*0.4; });
    mAngle+=dt*(prefersReducedMotion?0.05:0.22); // ~0.22 rad/s → full orbit in ~28s
  }
  drawFrame(now);
}
requestAnimationFrame(t=>{lastG=t; requestAnimationFrame(gLoop);});
</script>
